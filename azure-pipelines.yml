trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # Debug the directory structure
  - script: |
      pwd
      ls -la
    displayName: 'Debug directory structure'

  # Install Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  # Install dependencies and build React app
  - script: |
      cd Client || exit 1
      npm install
      npm run build
      ls -alh build
    displayName: 'Install dependencies and build React App'

  # Deploy to Azure Static Web App
  - task: AzureStaticWebApp@0
    displayName: 'Deploy to Azure Static Web App'
    inputs:
      app_location: '/Client'      # Try with absolute path
      output_location: 'build'      # Relative to app_location
      skip_app_build: true         # Since we've already built the app
      skip_api_build: true
      is_static_export: true
      verbose: true                # Enable verbose logging
      azure_static_web_apps_api_token: '$(deployment_variable)'