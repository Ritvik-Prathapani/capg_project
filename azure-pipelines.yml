# Azure DevOps Pipeline for React Frontend in 'Client' folder
# Builds and deploys to Azure Static Web Apps

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
# Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# Install dependencies and build React app in Client folder
- script: |
    cd Client || exit 1
    npm install
    npm run build
  displayName: 'Build React App in Client folder'

# Deploy to Azure Static Web App
- task: AzureStaticWebApp@0
  inputs:
    app_location: 'Client'  # Location of your app source
    api_location: ''        # No API in this setup
    app_artifact_location: 'Client/build'  # Output of React build
    azure_static_web_apps_api_token: $(deployment_variable)  # Token from Azure Portal
  displayName: 'Deploy to Azure Static Web App'
