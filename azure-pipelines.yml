trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # Install Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  # Install dependencies and build React app
  - script: |
      cd Client || exit 1
      npm install
      npm run build
      ls -alh Client/build  # List build directory to verify
    displayName: 'Install dependencies and build React App'

  # Deploy to Azure Static Web App
  - task: AzureStaticWebApp@0  # Correct task version
    displayName: 'Deploy to Azure Static Web App'
    inputs:
      app_location: 'Client'
      output_location: 'Client/build'
      skip_app_build: false
      skip_api_build: false
      is_static_export: false
      verbose: false
      azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'  # Ensure this token is correctly set
