trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  # Install Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  # Install dependencies and build React app
  - script: |
      cd Client || exit 1
      npm install
      npm run build
      ls -alh build  # ✅ Correct path, no 'Client/' prefix
    displayName: 'Install dependencies and build React App'

  # Deploy to Azure Static Web App
  - task: AzureStaticWebApp@0
    displayName: 'Deploy to Azure Static Web App'
    inputs:
      app_location: '/Client'        # Folder with your React app
      output_location: 'build'      # Relative to app_location
      skip_app_build: false
      skip_api_build: false
      is_static_export: false
      verbose: false
      azure_static_web_apps_api_token: '$(deployment_variable)'